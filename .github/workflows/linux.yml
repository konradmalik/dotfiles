on:
  push:
    branches:
      - main
  pull_request:

name: linux
permissions:
  contents: read
jobs:
  # nix flake check only runs the checks of its own system,
  # so each arch needs its own runner to get its VM tests run
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Flake check
        run: nix flake check

  build-shell:
    runs-on: ubuntu-26.04
    needs:
      - flake-check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Shell build
        run: nix build .#devShells.x86_64-linux.default

  check:
    runs-on: ubuntu-26.04
    needs:
      - build-shell
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Formatting and linting
        run: nix develop --command make check

  build-nixos:
    strategy:
      fail-fast: false
      matrix:
        host:
          - { hostname: framework, os: ubuntu-26.04 }
          - { hostname: rpi4-1, os: ubuntu-26.04-arm }
          - { hostname: rpi4-2, os: ubuntu-26.04-arm }
          - { hostname: x1c6, os: ubuntu-26.04 }
    runs-on: ${{ matrix.host.os }}
    needs:
      - flake-check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Flake build ${{ matrix.host.hostname }}
        run: nix build .#nixosConfigurations.${{ matrix.host.hostname }}.config.system.build.toplevel
