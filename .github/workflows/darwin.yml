on:
  push:
    branches:
      - main
  pull_request:

name: darwin
jobs:
  flake-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true
      - name: Flake check
        env:
          # workaround for segfaults
          # https://github.com/NixOS/nix/issues/4246
          GC_DONT_GC: 1
        run: nix flake check

  build-shell:
    runs-on: macos-26
    needs:
      - flake-check
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: cachix/cachix-action@v17
        with:
          name: "konradmalik"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Shell build
        run: nix build .#devShells.aarch64-darwin.default

  build-linux-builder-image:
    runs-on: ubuntu-26.04-arm
    needs:
      - flake-check
    steps:
      - uses: actions/checkout@v7
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: cachix/cachix-action@v17
        with:
          name: "konradmalik"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build linux-builder guest system
        run: nix build .#darwinConfigurations.m4.config.nix.linux-builder.package.nixosConfig.system.build.toplevel

  build-m4:
    runs-on: macos-26
    needs:
      - flake-check
      - build-builder-image
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: cachix/cachix-action@v17
        with:
          name: "konradmalik"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Flake build m4
        run: nix build .#darwinConfigurations.m4.system
