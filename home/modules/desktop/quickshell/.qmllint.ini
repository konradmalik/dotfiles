# Shared by the linter (lint.nix) and the language server: qmlls runs qmllint
# internally and both search for this file upward from each qml file, so
# silencing a category here silences it in the editor too.
#
# What is silenced is quickshell's own type metadata rather than anything in
# this config: it creates PanelWindow itself instead of declaratively, its
# qmltypes do not declare GlobalShortcut or the bluetooth models, and the popup
# anchor's grouped properties carry no type. Everything else stays fatal --
# above all unqualified access, which is how both a missing singleton import
# and a missing ComponentBehavior pragma show up.
[Warnings]
UncreatableType=disable
UnresolvedType=disable
MissingType=disable
ImportFailure=disable
